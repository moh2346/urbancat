<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
<title>Urban Cats icon</title>
<!-- Premium front-facing kitty: symmetrical, smooth strokes, restrained details -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer head with refined pointed ears and softly rounded U/C chin -->
  <path d="M14.5 22.5 L19 7.5 L24.2 15.2 L32 12.5 L39.8 15.2 L45 7.5 L49.5 22.5 C50.2 27.2 48.6 32.8 32 39.2 C15.4 32.8 13.8 27.2 14.5 22.5 Z" fill="#292a26" stroke="#292a26" stroke-width="1.6"/>
  <!-- Inner ear bronze accents -->
  <path d="M19.2 11.8 L21.2 16.6 L17.2 18.6 Z" fill="#a4835d" stroke="none"/>
  <path d="M44.8 11.8 L46.8 18.6 L42.8 16.6 Z" fill="#a4835d" stroke="none"/>
  <!-- Cream inner face for contrast on charcoal head -->
  <path d="M17.5 22 C17.5 22 18.2 30.2 32 36.8 C45.8 30.2 46.5 22 46.5 22 C46.5 22 40 16 32 14.8 C24 16 17.5 22 17.5 22 Z" fill="#fffdf9" stroke="none" opacity="1"/>
  <!-- Eyes -->
  <circle cx="24" cy="24.2" r="2.1" fill="#292a26" stroke="none"/>
  <circle cx="40" cy="24.2" r="2.1" fill="#292a26" stroke="none"/>
  <!-- Subtle eye highlight -->
  <circle cx="24.6" cy="23.6" r="0.45" fill="#fffdf9" opacity="0.9"/>
  <circle cx="40.6" cy="23.6" r="0.45" fill="#fffdf9" opacity="0.9"/>
  <!-- Nose (small inverted triangle / olive accent) -->
  <path d="M31.1 28.2 L32.9 28.2 L32 29.8 Z" fill="#6f7955" stroke="#6f7955" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M28.2 32.2 C28.2 32.2 30.2 33.8 32 33.8 C33.8 33.8 35.8 32.2 35.8 32.2" stroke="#292a26" stroke-width="1.1" fill="none"/>
  <path d="M32 30.2 L32 33.8" stroke="#292a26" stroke-width="0.9" fill="none"/>
  <!-- Whiskers - restrained 3 per side -->
  <g stroke="#292a26" stroke-width="0.85" opacity="0.95">
    <path d="M15.8 26.5 L9.2 24.8"/>
    <path d="M15.6 29.2 L8.4 29.2"/>
    <path d="M15.8 31.9 L9.4 33.6"/>
    <path d="M48.2 26.5 L54.8 24.8"/>
    <path d="M48.4 29.2 L55.6 29.2"/>
    <path d="M48.2 31.9 L54.6 33.6"/>
  </g>
  <!-- Subtle curved line suggesting U / C (lower chin accent) -->
  <path d="M22.5 34.6 C24.8 36.8 28.6 38.2 32 38.2 C35.4 38.2 39.2 36.8 41.5 34.6" stroke="#a4835d" stroke-width="1" fill="none" opacity="0.85"/>
</g>
</svg>
